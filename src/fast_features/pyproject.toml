[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fast_features"
version = "0.1.0"
description = "High-performance acoustic feature extraction"
requires-python = ">=3.8"
dependencies = [
    "numpy>=0.22",
]

[tool.maturin]
features = ["pyo3/extension-module"]
